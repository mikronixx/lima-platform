version: 2
updates:
  - package-ecosystem: "pip"
    directories: ["/", "/ansible"]
    schedule:
      interval: "weekly"
    groups:
      ansible:
        patterns: ["*"]            # ansible + ansible-core bumped together in one PR

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      hooks:
        patterns: ["*"]
