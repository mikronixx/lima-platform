version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/ansible"
    schedule:
      interval: "weekly"
    groups:
      ansible:
        patterns: ["*"]            # ansible + ansible-core bumped together in one PR
    cooldown:
      default-days: 7

  - package-ecosystem: "pip"
    directory: "/"                 # requirements-pre-commit.txt (the pre-commit tool)
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
    cooldown:
      default-days: 7

  - package-ecosystem: "pre-commit"  # the hooks in .pre-commit-config.yaml
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      hooks:
        patterns: ["*"]
    cooldown:
      default-days: 7
